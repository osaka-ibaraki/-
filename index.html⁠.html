<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北摂アキネイター - 自治体当てっこゲーム</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-sky-800 to-emerald-800 min-h-screen text-slate-800 flex items-center justify-center p-4">

    <div class="max-w-xl w-full mx-auto glass-panel rounded-3xl shadow-2xl overflow-hidden p-6 md:p-8 relative">
        
        <header class="text-center mb-6">
            <div class="inline-block bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-2">
                北摂7市3町限定
            </div>
            <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">
                北摂アキネイター
            </h1>
            <p class="text-sm text-slate-600 mt-1">
                頭の中で北摂の市町村をひとつ思い浮かべてください。質問に答えていくと、AIが当ててみせます！
            </p>
        </header>

        <div id="start-screen" class="text-center py-8">
            <div class="bg-sky-50 border border-sky-200 rounded-2xl p-4 mb-6 text-left">
                <h3 class="font-bold text-sky-900 mb-1 text-sm">💡 対象の自治体（全10市区町）</h3>
                <p class="text-xs text-sky-800 leading-relaxed">
                    豊中市、池田市、吹田市、高槻市、茨木市、箕面市、摂津市、島本町、豊能町、能勢町
                </p>
            </div>
            <button onclick="startGame()" class="w-full bg-gradient-to-r from-indigo-600 to-sky-600 hover:from-indigo-700 hover:to-sky-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transition transform active:scale-95 text-lg">
                ゲームスタート！ 🚀
            </button>
        </div>

        <div id="game-screen" class="hidden">
            <!-- Status Bar -->
            <div class="flex justify-between items-center bg-slate-100 rounded-xl px-4 py-2 mb-6 text-xs font-semibold text-slate-600">
                <span id="question-count">質問 1 / 15</span>
                <span id="candidate-count" class="bg-indigo-600 text-white px-2 py-0.5 rounded-full">残り候補: 10</span>
            </div>

            <!-- Question Box -->
            <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm mb-6 text-center min-h-[120px] flex items-center justify-center">
                <h2 id="question-text" class="text-lg md:text-xl font-bold text-slate-800 leading-snug">
                    質問がここに表示されます
                </h2>
            </div>

            <!-- Answer Buttons -->
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="answerQuestion('yes')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow transition transform active:scale-95 text-base flex items-center justify-center gap-2">
                    <span>👍</span> はい
                </button>
                <button onclick="answerQuestion('no')" class="bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 px-4 rounded-xl shadow transition transform active:scale-95 text-base flex items-center justify-center gap-2">
                    <span>👎</span> いいえ
                </button>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="answerQuestion('dont_know')" class="bg-amber-500 hover:bg-amber-600 text-white font-semibold py-3 px-4 rounded-xl shadow transition transform active:scale-95 text-sm flex items-center justify-center gap-2">
                    <span>🤔</span> わからない
                </button>
                <button onclick="answerQuestion('probably_yes')" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold py-3 px-4 rounded-xl shadow transition transform active:scale-95 text-sm flex items-center justify-center gap-2">
                    <span>✨</span> たぶんそう
                </button>
            </div>
        </div>

        <div id="result-screen" class="hidden text-center py-6">
            <div class="inline-block bg-amber-100 text-amber-800 text-sm font-bold px-4 py-1.5 rounded-full mb-3">
                ✨ 推理完了！
            </div>
            <h3 class="text-sm text-slate-500 mb-1">あなたが思い浮かべたのは...</h3>
            <h2 id="result-name" class="text-3xl md:text-4xl font-extrabold text-indigo-900 mb-2">
                〇〇市
            </h2>
            <p id="result-desc" class="text-sm text-slate-600 bg-slate-50 border border-slate-200 rounded-xl p-4 mb-6 text-left">
                説明文がここに表示されます。
            </p>

            <div class="flex gap-3">
                <button onclick="resetGame(true)" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow transition">
                    正解！ 🎉
                </button>
                <button onclick="resetGame(false)" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 px-4 rounded-xl shadow transition">
                    外れた... 💦
                </button>
            </div>
        </div>

        <div class="text-center mt-6 text-xs text-slate-400">
            北摂自治体データベース駆動アプリ
        </div>
    </div>

    <script>
        // 北摂7市3町のデータベース
        const hokusetsuData = [
            {
                id: "toyonaka",
                name: "豊中市",
                population_over_300k: true,
                population_over_400k: true,
                hankyu_line: true,
                hankyu_takarazuka_line: true,
                subway: true, 
                monorail: true,
                jr_line: false,
                borders_hyogo: true,
                borders_kyoto: false,
                airport_access: true, 
                university_campus: true, 
                lalaport: false,
                aeon_mall: false,
                desc: "大阪国際空港（伊丹空港）があり、大阪大学豊中キャンパスや阪急宝塚線・御堂筋線（北大阪急行）が通る、人口約40万人の文教都市です。"
            },
            {
                id: "ikeda",
                name: "池田市",
                population_over_300k: false,
                population_over_200k: false,
                population_over_100k: true,
                hankyu_line: true,
                hankyu_takarazuka_line: true,
                subway: false,
                monorail: false,
                jr_line: false,
                borders_hyogo: true,
                borders_kyoto: false,
                instant_noodles_origin: true, 
                wombat: true, 
                desc: "五月山の自然豊かな環境に恵まれ、インスタントラーメン発祥の地やウォンバットで有名な動物園がある街です。"
            },
            {
                id: "suita",
                name: "吹田市",
                population_over_300k: true,
                population_over_400k: false,
                hankyu_line: true,
                hankyu_senri_line: true,
                subway: true, 
                monorail: true,
                jr_line: true,
                borders_hyogo: false,
                borders_kyoto: false,
                national_univ: true, 
                lalaport: true, 
                soccer_stadium: true, 
                desc: "万博記念公園や太陽の塔、ららぽーとEXPOCITYがあり、Jリーグ・ガンバ大阪のホームスタジアムや阪大吹田キャンパスを有する街です。"
            },
            {
                id: "takatsuki",
                name: "高槻市",
                population_over_300k: true,
                population_over_400k: false,
                hankyu_line: true,
                hankyu_limited_express: true, 
                subway: false,
                monorail: false,
                jr_line: true,
                jr_rapid: true, 
                borders_hyogo: false,
                borders_kyoto: true, 
                department_store: true, 
                municipal_bus: true, 
                desc: "JRの新快速と阪急の特急がどちらも停車し、京都府にも隣接するアクセスの良い中核市。独自の市営バスが網の目のように走っています。"
            },
            {
                id: "ibaraki",
                name: "茨木市",
                population_over_200k: true,
                population_over_300k: false,
                hankyu_line: true,
                hankyu_limited_express: true, 
                subway: false,
                monorail: true,
                jr_line: true,
                jr_rapid: true, 
                borders_hyogo: false,
                borders_kyoto: true, 
                aeon_mall: true, 
                municipal_buses_multi: true, 
                desc: "JRと阪急の両方に特急・快速が止まり、イオンモールや大阪モノレールもある、京都府に隣接した交通の要衝です。"
            },
            {
                id: "minoo",
                name: "箕面市",
                population_over_100k: true,
                population_over_200k: false,
                hankyu_line: true,
                hankyu_minoo_line: true,
                subway_extension: true, 
                monorail: false,
                jr_line: false,
                borders_hyogo: true,
                borders_kyoto: false,
                waterfall: true, 
                boat_race: false,
                desc: "日本の滝百選に選ばれた箕面大滝や紅葉の天ぷらで有名。北大阪急行が延伸開業し、ますます便利になった緑豊かな街です。"
            },
            {
                id: "settsu",
                name: "摂津市",
                population_over_80k: true,
                population_over_100k: false,
                hankyu_line: true,
                subway: false,
                monorail: true,
                jr_line: true,
                borders_hyogo: false,
                borders_kyoto: false,
                shinkansen_base: true, 
                desc: "新幹線の車両基地（鳥飼基地）があり、大阪モノレールやJR・阪急がコンパクトに通る、ものづくりの盛んな街です。"
            },
            {
                id: "shimamoto",
                name: "島本町",
                town: true,
                population_under_30k: true,
                hankyu_line: true,
                jr_line: true,
                subway: false,
                monorail: false,
                borders_hyogo: false,
                borders_kyoto: true, 
                whisky_distillery: true, 
                desc: "北摂唯一の「町」。京都府に隣接し、名水百選にも選ばれたサントリー山崎蒸溜所がある、自然と歴史に満ちた街です。"
            },
            {
                id: "toyono",
                name: "豊能町",
                town: true,
                population_under_20k: true,
                mountain_area: true, 
                nose_railway: true, 
                hankyu_line: false,
                jr_line: false,
                subway: false,
                monorail: false,
                borders_hyogo: true,
                desc: "能勢電鉄が走り、緑豊かな山間部と光風台などの住宅地が広がる、穏やかな雰囲気に包まれた町です。"
            },
            {
                id: "nose",
                name: "能勢町",
                town: true,
                population_under_10k: true,
                mountain_area: true,
                nose_railway: false, 
                hankyu_line: false,
                jr_line: false,
                subway: false,
                monorail: false,
                borders_hyogo: true,
                chestnut_specialty: true, 
                desc: "大阪府の最北端に位置し、豊かな自然と「能勢栗」などの特産品、美しい里山の風景が残る静かな町です。"
            }
        ];

        const questions = [
            { key: "town", text: "選んだ自治体は「市」ではなく「町」ですか？" },
            { key: "jr_line", text: "JR（東海道本線など）の駅が通っていますか？" },
            { key: "hankyu_line", text: "阪急電鉄の路線が通っていますか？" },
            { key: "monorail", text: "大阪モノレールが通っていますか？" },
            { key: "subway", text: "地下鉄（御堂筋線や北大阪急行など）が乗り入れていますか？" },
            { key: "borders_kyoto", text: "京都府に隣接していますか？" },
            { key: "borders_hyogo", text: "兵庫県に隣接していますか？" },
            { key: "mountain_area", text: "山間部や里山のイメージが強く、自然豊かなエリアですか？" },
            { key: "hankyu_limited_express", text: "阪急の「特急」が停車する駅がありますか？" },
            { key: "jr_rapid", text: "JRの「快速」または「新快速」が停車する駅がありますか？" },
            { key: "population_over_300k", text: "人口が30万人以上ですか？" },
            { key: "population_over_200k", text: "人口が20万人以上ですか？" },
            { key: "lalaport", text: "「ららぽーとEXPOCITY」や「万博記念公園」がありますか？" },
            { key: "aeon_mall", text: "「イオンモール」がありますか？" },
            { key: "airport_access", text: "空港や大きな大学キャンパスがありますか？" },
            { key: "shinkansen_base", text: "新幹線の車両基地がありますか？" },
            { key: "whisky_distillery", text: "有名なウイスキーの蒸溜所や名水スポットがありますか？" },
            { key: "wombat", text: "ウォンバットがいる動物園や、インスタントラーメン発祥の地ですか？" },
            { key: "waterfall", text: "有名な滝がありますか？" },
            { key: "nose_railway", text: "能勢電鉄が走っていますか？" }
        ];

        let gameState = {
            candidates: [],
            askedQuestions: [],
            currentQuestion: null,
            questionCount: 0,
            maxQuestions: 12
        };

        function startGame() {
            gameState.candidates = [...hokusetsuData];
            gameState.askedQuestions = [];
            gameState.questionCount = 0;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            nextQuestion();
        }

        function nextQuestion() {
            if (gameState.candidates.length <= 1 || gameState.questionCount >= gameState.maxQuestions) {
                showResult();
                return;
            }

            let bestQ = null;
            let minDiff = 999;

            const availableQuestions = questions.filter(q => !gameState.askedQuestions.includes(q.key));
            if (availableQuestions.length === 0) {
                showResult();
                return;
            }

            for (let q of availableQuestions) {
                let yesCount = gameState.candidates.filter(c => c[q.key] === true).length;
                let diff = Math.abs(yesCount - (gameState.candidates.length / 2));
                if (diff < minDiff) {
                    minDiff = diff;
                    bestQ = q;
                }
            }

            gameState.currentQuestion = bestQ;
            gameState.askedQuestions.push(bestQ.key);
            gameState.questionCount++;

            document.getElementById('question-count').innerText = `質問 ${gameState.questionCount} / ${gameState.maxQuestions}`;
            document.getElementById('candidate-count').innerText = `残り候補: ${gameState.candidates.length}`;
            document.getElementById('question-text').innerText = bestQ.text;
        }

        function answerQuestion(answerType) {
            const key = gameState.currentQuestion.key;

            if (answerType === 'yes') {
                gameState.candidates = gameState.candidates.filter(c => c[key] === true);
            } else if (answerType === 'no') {
                gameState.candidates = gameState.candidates.filter(c => c[key] !== true);
            } else if (answerType === 'probably_yes') {
                let filtered = gameState.candidates.filter(c => c[key] === true);
                if (filtered.length > 0) gameState.candidates = filtered;
            }

            nextQuestion();
        }

        function showResult() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            let finalTarget = gameState.candidates.length > 0 ? gameState.candidates[0] : hokusetsuData[0];

            document.getElementById('result-name').innerText = finalTarget.name;
            document.getElementById('result-desc').innerText = finalTarget.desc;
        }

        function resetGame(isSuccess) {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }
    </script>

</body>
</html>
